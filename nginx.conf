server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.open-meteo.com; worker-src 'self'; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets
    location /trip-planner/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache PWA assets
    location /trip-planner/ {
        try_files $uri $uri/ /trip-planner/index.html;

        location ~* \.(?:ico|svg|webmanifest|png|jpg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /trip-planner/ {
            expires -1;
            add_header Cache-Control "no-cache";
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
